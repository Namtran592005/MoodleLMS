x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    image: moodle-caddy:latest
    build:
      context: ./caddy
    container_name: moodle_caddy
    restart: always
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # access.log mode 644 (Caddy mac dinh 600) de user host doc duoc
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mkdir -p /var/log/caddy
        touch /var/log/caddy/access.log
        chmod 644 /var/log/caddy/access.log
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./logs/caddy:/var/log/caddy
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - moodle_net
    depends_on:
      moodle:
        condition: service_healthy

  db:
    image: mysql:9
    container_name: moodle_db
    restart: always
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent 2>/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    # root de sua owner log truoc khi mysqld drop xuong user mysql
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mkdir -p /var/log/mysql
        # chi doi owner, giu group de host van doc duoc log
        chown -R mysql /var/log/mysql 2>/dev/null || true
        chmod 2770 /var/log/mysql 2>/dev/null || true
        chmod 0775 /backup 2>/dev/null || true
        LOGOPT="--log-error=/var/log/mysql/error.log"
        if ! gosu mysql sh -c 'touch /var/log/mysql/.wtest' 2>/dev/null; then
          echo "[db] CANH BAO: khong ghi duoc /var/log/mysql -> log ra stdout" >&2
          LOGOPT=""
        fi
        rm -f /var/log/mysql/.wtest 2>/dev/null || true
        exec docker-entrypoint.sh mysqld \
          --character-set-server=utf8mb4 \
          --collation-server=utf8mb4_unicode_ci \
          --max-allowed-packet=128M \
          --innodb-file-per-table=1 \
          $$LOGOPT
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MOODLE_DB_NAME}
      MYSQL_USER: ${MOODLE_DB_USER}
      MYSQL_PASSWORD: ${MOODLE_DB_PASSWORD}
    volumes:
      - moodle_db_data:/var/lib/mysql
      - ./backup:/backup
      - ./logs/mysql:/var/log/mysql
    networks:
      - moodle_net
    labels:
      - "ofelia.enabled=true"
      - "ofelia.job-exec.db-backup.schedule=@daily"
      - "ofelia.job-exec.db-backup.command=bash -c 'mysqldump -u root -p\"$$MYSQL_ROOT_PASSWORD\" --default-character-set=utf8mb4 --single-transaction --quick $$MYSQL_DATABASE > /backup/moodle_latest.sql'"

  redis:
    image: redis:latest
    container_name: moodle_redis
    restart: always
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mkdir -p /var/log/redis
        chown -R redis /var/log/redis 2>/dev/null || true
        chmod 2770 /var/log/redis 2>/dev/null || true
        LOGOPT="--logfile /var/log/redis/redis.log"
        if ! setpriv --reuid redis --regid redis --clear-groups touch /var/log/redis/.wtest 2>/dev/null; then
          echo "[redis] CANH BAO: khong ghi duoc /var/log/redis -> log ra stdout" >&2
          LOGOPT=""
        fi
        rm -f /var/log/redis/.wtest 2>/dev/null || true
        exec docker-entrypoint.sh redis-server \
          --requirepass "${REDIS_PASSWORD}" \
          --appendonly yes \
          --maxmemory 256mb \
          --maxmemory-policy allkeys-lru \
          $$LOGOPT
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - ./logs/redis:/var/log/redis
    networks:
      - moodle_net

  moodle:
    build:
      context: ./php
      args:
        PUID: ${PUID:-1000}
        PGID: ${PGID:-1000}
    container_name: moodle_web
    restart: always
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1/login/index.php"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    expose:
      - "80"
    volumes:
      - ./moodle:/var/www/html
      - ./moodledata:/var/www/moodledata
      - ./backup:/backup
      - ./logs/php:/var/log/php
      - ./logs/moodle:/var/log/moodle
      - ./logs:/logs
      - ./scripts/log-rotate.sh:/usr/local/bin/log-rotate.sh:ro
    environment:
      # de trong = tu dong do owner cua moodle/ hoac moodledata/
      PUID: ${PUID:-}
      PGID: ${PGID:-}
      MOODLE_DB_HOST: db
      MOODLE_DB_NAME: ${MOODLE_DB_NAME}
      MOODLE_DB_USER: ${MOODLE_DB_USER}
      MOODLE_DB_PASSWORD: ${MOODLE_DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - moodle_net
    labels:
      - "ofelia.enabled=true"
      - "ofelia.job-exec.moodle-cron.schedule=@every 1m"
      - "ofelia.job-exec.moodle-cron.command=setpriv --reuid www-data --regid www-data --init-groups php /var/www/html/admin/cli/cron.php"
      # 17h UTC = 0h VN, giu 30 ngay
      - "ofelia.job-exec.logs-rotate.schedule=0 17 * * *"
      - "ofelia.job-exec.logs-rotate.command=sh /usr/local/bin/log-rotate.sh"

  cron:
    image: mcuadros/ofelia:latest
    container_name: moodle_cron_scheduler
    restart: always
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pidof ofelia >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      moodle:
        condition: service_healthy
    command: daemon --docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - moodle_net

volumes:
  moodle_db_data:
  caddy_data:
  caddy_config:

networks:
  moodle_net:
    driver: bridge
