; Ofelia runs these jobs through the CetusGuard proxy.
; Keep container names in sync with docker-compose.yml and ofelia/rules.list.

[job-exec "moodle-cron"]
schedule = @every 1m
container = moodle_web
command = setpriv --reuid www-data --regid www-data --init-groups php /var/www/html/admin/cli/cron.php --keep-alive=0

[job-exec "logs-rotate"]
schedule = 0 0 0 * * *
container = moodle_web
command = sh /usr/local/bin/log-rotate.sh

[job-exec "restic-backup"]
schedule = 0 0 0 * * *
container = moodle_web
command = nice -n 19 sh /scripts/restic-job.sh
